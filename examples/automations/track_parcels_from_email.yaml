# Extract Budbee tracking codes from incoming e-mail and register them
# with `budbee.track_parcel`, so parcels start tracking the moment the
# shipping confirmation lands in your inbox — no manual entry.
#
# Requirements:
#   - one or more core IMAP config entries with "text" enabled under
#     "message data" and the max message size raised (carrier mails are
#     long) — full setup guide and pitfalls: track_parcels_from_email.md
#   - optional: an `ai_task` entity for the AI fallback branch; delete
#     the whole `else:` block if you don't use one
#   - PRIVACY: by default this fires on EVERY incoming mail and (with the
#     AI branch) can send mail bodies to your AI Task. Scope the IMAP
#     search to the carrier's sender first — see "Scope & privacy" in the .md.
#
# The regex is deliberately written without backslashes (`(?<![0-9A-Za-z])`
# instead of `\b`, `[0-9]` instead of `\d`): Jinja treats `\b` inside a
# string literal as a backspace escape, so the pattern would silently
# never match.

alias: "Budbee: track from e-mail"
description: >-
  Listens to imap_content events from all IMAP entries. Fast regex path for
  Budbee tracking codes; optional AI fallback for mails whose layout the
  regex does not recognise.
mode: queued
max: 10

triggers:
  - trigger: event
    event_type: imap_content

variables:
  sender: "{{ trigger.event.data.sender | default('') | lower }}"
  subject: "{{ trigger.event.data.subject | default('') }}"
  body: "{{ trigger.event.data.text | default('') }}"
  content: "{{ subject ~ ' ' ~ body }}"
  # Budbee numbers carry no prefix and no fixed length, so matching them as
  # bare text would hit every order and invoice number in the mail. Anchor on
  # the tracking link instead — shops always include one, and the number is
  # its last path segment. Both the current host (track.budbee.com) and the
  # older one (tracking.budbee.com) are covered, as are the sibling brands
  # that share the same backend.
  budbee_codes: >-
    {{ content
       | regex_findall('(?:track|tracking)[.](?:budbee|instabox|porterbuddy)[.]com/([0-9A-Za-z]{4,40})')
       | unique | list }}
  # Keyword gate for the AI fallback — localise to your language(s).
  is_parcel_mail: >-
    {{ content | lower is search('pakket|bezorg|track|verzonden|onderweg|zending|shipment|delivery|levering') }}

conditions:
  # initial=true means "new message"; false means a duplicate trigger of
  # the SAME message (e.g. after a reconnect) — requiring it is free dedup.
  - condition: template
    value_template: "{{ trigger.event.data.initial | default(true) }}"
  - condition: template
    value_template: "{{ is_parcel_mail or budbee_codes | count > 0 }}"

actions:
  - repeat:
      for_each: "{{ budbee_codes }}"
      sequence:
        - action: budbee.track_parcel
          data:
            tracking_code: "{{ repeat.item }}"
  - if:
      - condition: template
        value_template: "{{ budbee_codes | count > 0 }}"
    then:
      - action: notify.mobile_app_your_phone
        data:
          title: "📦 Budbee parcel picked up from mail"
          message: >-
            {{ budbee_codes | join(', ') }} (mail from {{ sender }})
    else:
      # ---- Optional AI fallback — delete this block if you have no ai_task entity ----
      - action: ai_task.generate_data
        data:
          task_name: budbee-tracking-code-extraction
          entity_id: ai_task.your_ai_task_entity
          instructions: >-
            Below is an e-mail. Determine whether it contains a Budbee
            parcel tracking number. Budbee numbers are 4-40 letters and
            digits with no fixed prefix, so the reliable signal is a
            tracking link on track.budbee.com (or the older
            tracking.budbee.com) — return the number from that link. Note
            that Budbee is the same service as Instabox and Porterbuddy.
            Only return a real tracking number, never a customer or invoice
            number. If the mail is from a different carrier, answer 'other'.
            When in doubt: 'none'.

            Sender: {{ sender }}
            Subject: {{ subject }}
            Body:
            {{ body[:6000] }}
          structure:
            carrier:
              description: Whether a Budbee tracking code was found
              required: true
              selector:
                select:
                  options: ["budbee", "other", "none"]
            tracking_code:
              description: The tracking code, or empty if none
              required: false
              selector:
                text:
        response_variable: ai_result
      - choose:
          - conditions: "{{ ai_result.data.carrier == 'budbee' and (ai_result.data.tracking_code | default('') | trim) != '' }}"
            sequence:
              - action: budbee.track_parcel
                data:
                  tracking_code: "{{ ai_result.data.tracking_code | trim }}"
              - action: notify.mobile_app_your_phone
                data:
                  title: "📦 Budbee parcel picked up from mail (AI)"
                  message: "{{ ai_result.data.tracking_code | trim }} (mail from {{ sender }})"
          - conditions: "{{ ai_result.data.carrier == 'other' and (ai_result.data.tracking_code | default('') | trim) != '' }}"
            sequence:
              - action: notify.mobile_app_your_phone
                data:
                  title: "📦 Tracking number found – not a Budbee parcel"
                  message: "{{ ai_result.data.tracking_code | trim }} (mail from {{ sender }}, subject: {{ subject }})"
